name: fqa
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/figma/backgrounds/
    - assets/images/figma/buttons/
    - assets/images/figma/collectibles/
    - assets/images/figma/decor/
    - assets/images/figma/icons/
    - assets/images/figma/navigation/
    - assets/images/figma/panels/
